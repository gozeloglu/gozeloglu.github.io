baseURL: 'https://example.org/'
locale: 'tr-TR'
title: 'Gökhan Özeloğlu'
theme: 'PaperMod'

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Gökhan Özeloğlu"
  description: "Kişisel web sitesi ve blog."
  keywords: [Blog, Portfolyo, Yazılım, Teknoloji]
  author: "Gökhan Özeloğlu"
  DateFormat: "2 January 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  profileMode:
    enabled: true
    title: "Gökhan Özeloğlu"
    subtitle: "Yazılım Geliştirici & Teknoloji Meraklısı 🚀"
    imageUrl: ""
    imageTitle: "Gökhan Özeloğlu"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: "Yazılar"
        url: "/posts/"
      - name: "Hakkımda"
        url: "/about/"
      - name: "Etiketler"
        url: "/tags/"

  socialIcons:
    - name: github
      url: "https://github.com/gozeloglu"
    - name: bluesky
      url: "https://bsky.app/profile/ozeloglu.io"
    - name: linkedin
      url: "https://www.linkedin.com/in/gokhanozeloglu/"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Yazılar
      url: /posts/
      weight: 10
    - identifier: archives
      name: Arşiv
      url: /archives/
      weight: 20
    - identifier: search
      name: Ara
      url: /search/
      weight: 30
    - identifier: tags
      name: Etiketler
      url: /tags/
      weight: 40
    - identifier: tools
      name: Tools
      url: /json/
      weight: 45
    - identifier: about
      name: Hakkımda
      url: /about/
      weight: 50
