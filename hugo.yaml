baseURL: 'https://ozeloglu.io/'
locale: 'en-US'
defaultContentLanguage: 'en'
title: 'Gökhan Özeloğlu'
theme: 'PaperMod'

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 5

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  mainSections: ["posts"]
  title: "Gökhan Özeloğlu"
  description: "Personal website and blog."
  keywords: [Blog, Portfolio, Software, Technology]
  author: "Gökhan Özeloğlu"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  profileMode:
    enabled: true
    title: "Gökhan Özeloğlu"
    subtitle: "Software Engineer"
    imageUrl: ""
    imageTitle: "Gökhan Özeloğlu"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: "Posts"
        url: "/posts/"
      - name: "Tools"
        url: "/tools/"
      - name: "About"
        url: "/about/"

  socialIcons:
    - name: github
      url: "https://github.com/gozeloglu"
    - name: bluesky
      url: "https://bsky.app/profile/ozeloglu.io"
    - name: linkedin
      url: "https://www.linkedin.com/in/gokhanozeloglu/"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tools
      name: Tools
      url: /tools/
      weight: 20
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
